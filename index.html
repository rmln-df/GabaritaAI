        function inserirSimbolo(simbolo){

    const campo =
        document.getElementById('enunciadoInput');

    const inicio = campo.selectionStart;
    const fim = campo.selectionEnd;

    campo.value =
        campo.value.substring(0, inicio)
        + simbolo +
        campo.value.substring(fim);

    campo.focus();

    campo.selectionStart =
        campo.selectionEnd =
        inicio + simbolo.length;
}

    <script>
        let questoesParaResponder = [];
        let indiceAtual = 0;

        window.addEventListener("load", () => {
            // Listener unificado que forçará a atualização em todos os dispositivos
            db.ref('bancoEstudos').on('value', (snapshot) => {
                let data = snapshot.val();
                // Forçamos o dado a ser um array puro
                const banco = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                localStorage.setItem('bancoEstudos', JSON.stringify(banco));
                
                atualizarContadores();
                if(document.getElementById('disciplinas').classList.contains('active')) listarDisciplinasUnicas();
                if(document.getElementById('questoes').classList.contains('active')) carregarMenuMaterias();
                console.log("Banco sincronizado via Firebase:", banco);
            });
            setTimeout(() => { document.getElementById("splashScreen").classList.add("fade-out"); }, 3000);
        });

        function syncFirebase(banco) { 
            // Converte para array limpo para evitar conflitos de índices do Firebase
            const bancoLimpo = Object.values(banco);
            db.ref('bancoEstudos').set(bancoLimpo);
            console.log("Enviando para Firebase...");
        }
        
        function atualizarContadores(){
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            document.getElementById('totalMaterias').innerText = new Set(banco.map(q => q.materia)).size;
            document.getElementById('totalAcertos').innerText = localStorage.getItem('acertos') || 0;
            document.getElementById('totalErros').innerText = localStorage.getItem('erros') || 0;
        }

        function resetForm() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('materiaInput').value = "";
            document.getElementById('enunciadoInput').value = "";
            document.getElementById('op1').value = ""; document.getElementById('op2').value = "";
            document.getElementById('op3').value = ""; document.getElementById('op4').value = "";
            document.getElementById('op5').value = "";
            document.getElementById('formAdd').classList.remove('hidden');
        }

        function editarQuestao(index) {
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            const q = banco[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('materiaInput').value = q.materia;
            document.getElementById('enunciadoInput').value = q.enunciado;
            document.getElementById('op1').value = q.opcoes[0];
            document.getElementById('op2').value = q.opcoes[1];
            document.getElementById('op3').value = q.opcoes[2];
            document.getElementById('op4').value = q.opcoes[3];
            document.getElementById('op5').value = q.opcoes[4];
            document.getElementById('corretaSelect').value = q.correta;
            document.getElementById('formAdd').classList.remove('hidden');
        }

        function salvarQuestao(){
            const index = parseInt(document.getElementById('editIndex').value);
            const nova = { 
                materia: document.getElementById('materiaInput').value, 
                enunciado: document.getElementById('enunciadoInput').value, 
                opcoes: [document.getElementById('op1').value, document.getElementById('op2').value, document.getElementById('op3').value, document.getElementById('op4').value, document.getElementById('op5').value], 
                correta: document.getElementById('corretaSelect').value 
            };
            let banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            if(index > -1) banco[index] = nova; else banco.push(nova);
            syncFirebase(banco);
            document.getElementById('formAdd').classList.add('hidden');
        }

        function openScreen(id){
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'questoes') carregarMenuMaterias();
            if(id === 'disciplinas') listarDisciplinasUnicas();
        }

        function listarDisciplinasUnicas(){
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            const lista = document.getElementById('listaDisciplinas');
            lista.innerHTML = '';
            [...new Set(banco.map(q => q.materia))].forEach(materia => {
                lista.innerHTML += `<button class="btn" onclick="exibirQuestoesDaMateria('${materia}')">${materia}</button>`;
            });
        }

        function exibirQuestoesDaMateria(materia) {
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            const lista = document.getElementById('listaDisciplinas');
            lista.innerHTML = `<button class="btn" onclick="listarDisciplinasUnicas()"><i class="fas fa-arrow-left"></i> Voltar</button><h3>${materia}</h3>`;
            banco.forEach((q, idx) => {
                if(q.materia === materia) {
                    lista.innerHTML += `<div class="card"><p><strong>${q.enunciado}</strong></p>
                    <button class="btn-edit" onclick="editarQuestao(${idx})">Editar</button>
                    <button class="btn-del" onclick="deletarQuestao(${idx})">Apagar</button></div>`;
                }
            });
        }

        function deletarQuestao(index) { confirmarAcao('Excluir?', 'Tem certeza?', `executarDelecao(${index})`); }
        function executarDelecao(index) {
            let banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            banco.splice(index, 1);
            syncFirebase(banco);
        }

        function confirmarAcao(titulo, msg, acao) {
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modalBtns').innerHTML = `<button class="modal-btn" style="background:#ef4444;" onclick="fecharModal()">Não</button>
                                                              <button class="modal-btn" style="background:#22c55e;" onclick="${acao}; fecharModal();">Sim</button>`;
            document.getElementById('customModal').style.display = 'flex';
        }
        function fecharModal() { document.getElementById('customModal').style.display = 'none'; }
        function resetarEstatisticas() { localStorage.removeItem('acertos'); localStorage.removeItem('erros'); atualizarContadores(); }

        function carregarMenuMaterias(){
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            const menu = document.getElementById('menuMaterias');
            menu.classList.remove('hidden');
            document.getElementById('areaQuestao').classList.add('hidden');
            menu.innerHTML = '<h3>Selecione uma matéria:</h3>';
            [...new Set(banco.map(q => q.materia))].forEach(m => menu.innerHTML += `<button class="btn" onclick="iniciarSessao('${m}')">${m}</button>`);
        }

        function iniciarSessao(materia) {
            const banco = JSON.parse(localStorage.getItem('bancoEstudos') || '[]');
            questoesParaResponder = banco.filter(q => q.materia === materia).sort(() => Math.random() - 0.5);
            indiceAtual = 0;
            document.getElementById('menuMaterias').classList.add('hidden');
            renderizarQuestao();
        }

        function renderizarQuestao() {
            const container = document.getElementById('conteudoQuestao');
            document.getElementById('areaQuestao').classList.remove('hidden');
            if (indiceAtual >= questoesParaResponder.length) {
                container.innerHTML = `<h3>Sessão Finalizada!</h3><button class="btn" onclick="openScreen('questoes')">Voltar ao menu</button>`;
                return;
            }
            const q = questoesParaResponder[indiceAtual];
            container.innerHTML = `<h3>${q.materia} (${indiceAtual + 1}/${questoesParaResponder.length})</h3>
                <div class="card"><p><strong>${q.enunciado}</strong></p>
                ${q.opcoes.map((op, i) => `<button class="btn opt-btn" style="background:#334155" onclick="verificar(this, ${i}, ${q.correta})">${op}</button>`).join('')}</div>
                <div id="proxContainer"></div>`;
        }

        function verificar(btn, escolhida, correta){
            const botoes = document.querySelectorAll('.opt-btn');
            botoes.forEach(b => b.style.pointerEvents = 'none');
            if(escolhida == correta) { localStorage.setItem('acertos', parseInt(localStorage.getItem('acertos') || 0) + 1); btn.style.background = "#22c55e"; }
            else { localStorage.setItem('erros', parseInt(localStorage.getItem('erros') || 0) + 1); btn.style.background = "#ef4444"; botoes[correta].style.background = "#22c55e"; }
            document.getElementById('proxContainer').innerHTML = `<button class="btn" style="background:#6366f1" onclick="indiceAtual++; renderizarQuestao()">Próxima Questão</button>`;
            atualizarContadores();
        }
    </script>
</body>
</html>
